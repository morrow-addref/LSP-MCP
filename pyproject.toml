[project]
name = "lsp-mcp"
version = "0.2.0"
description = "Minimal MCP server bridging any LSP language server's diagnostics to AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp",
]

[project.scripts]
lsp-mcp = "lsp_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
